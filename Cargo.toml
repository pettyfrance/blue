[package]
name = "blue"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.11"
clap = { version = "4.6.1", features = ["derive"] }
petgraph = "0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh-key = "0.6.7"
thiserror = "2.0.18"
toml_parser = { version = "1.1.3", features = ["alloc"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
